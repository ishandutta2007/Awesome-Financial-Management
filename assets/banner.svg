<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes waveDash {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes barPulse1 {
        0%, 100% { height: 45px; y: 265px; }
        50% { height: 75px; y: 235px; }
      }
      @keyframes barPulse2 {
        0%, 100% { height: 70px; y: 240px; }
        50% { height: 105px; y: 205px; }
      }
      @keyframes barPulse3 {
        0%, 100% { height: 95px; y: 215px; }
        50% { height: 55px; y: 255px; }
      }
      @keyframes barPulse4 {
        0%, 100% { height: 120px; y: 190px; }
        50% { height: 140px; y: 170px; }
      }

      .floating-orb-1 {
        animation: pulseGlow 7s ease-in-out infinite alternate;
        transform-origin: 200px 100px;
      }
      .floating-orb-2 {
        animation: pulseGlow 9s ease-in-out infinite alternate 1.5s;
        transform-origin: 1050px 250px;
      }
      .chip-card-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .chip-card-2 {
        animation: floatReverse 6s ease-in-out infinite 0.8s;
      }
      .animated-chart-line {
        stroke-dasharray: 1000;
        animation: waveDash 18s linear infinite;
      }
      .bar-anim-1 { animation: barPulse1 4s ease-in-out infinite; }
      .bar-anim-2 { animation: barPulse2 4.5s ease-in-out infinite; }
      .bar-anim-3 { animation: barPulse3 5s ease-in-out infinite; }
      .bar-anim-4 { animation: barPulse4 3.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1280" height="380" rx="16" fill="url(#grid)" />

  <!-- DYNAMIC BACKGROUND LAYER (Ambient glows, charts, particles) -->
  <g id="dynamic-ambient-background">
    <!-- Glowing Nebulas -->
    <circle class="floating-orb-1" cx="200" cy="90" r="140" fill="#38bdf8" opacity="0.25" filter="url(#softGlow)" />
    <circle class="floating-orb-2" cx="1080" cy="270" r="160" fill="#6366f1" opacity="0.25" filter="url(#softGlow)" />
    <circle class="floating-orb-1" cx="800" cy="70" r="110" fill="#10b981" opacity="0.18" filter="url(#softGlow)" />

    <!-- Stylized Financial Background Chart Grid (Right Side) -->
    <g opacity="0.4" transform="translate(740, 100)">
      <!-- Chart Area -->
      <path d="M 0 180 Q 90 120 180 150 T 360 80 T 500 40 L 500 200 L 0 200 Z" fill="url(#chartAreaGrad)" />
      <!-- Chart Line -->
      <path class="animated-chart-line" d="M 0 180 Q 90 120 180 150 T 360 80 T 500 40" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
      <!-- Pulsing Data Nodes -->
      <circle cx="180" cy="150" r="5" fill="#38bdf8" filter="url(#glow)" />
      <circle cx="360" cy="80" r="5" fill="#10b981" filter="url(#glow)" />
      <circle cx="500" cy="40" r="6" fill="#a855f7" filter="url(#glow)" />
    </g>

    <!-- Animated Financial Bars (Far Right Ambient) -->
    <g opacity="0.35">
      <rect class="bar-anim-1" x="1110" y="265" width="16" height="45" rx="4" fill="#38bdf8" />
      <rect class="bar-anim-2" x="1136" y="240" width="16" height="70" rx="4" fill="#6366f1" />
      <rect class="bar-anim-3" x="1162" y="215" width="16" height="95" rx="4" fill="#10b981" />
      <rect class="bar-anim-4" x="1188" y="190" width="16" height="120" rx="4" fill="#a855f7" />
    </g>

    <!-- Dynamic Decorative Metric Card 1 (Upper Right) -->
    <g class="chip-card-1" transform="translate(940, 42)">
      <rect width="180" height="54" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#glow)" />
      <circle cx="28" cy="27" r="12" fill="#10b981" fill-opacity="0.2" />
      <text x="28" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#10b981" text-anchor="middle" font-weight="bold">↑</text>
      <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" font-weight="500">CASH VISIBILITY</text>
      <text x="50" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#f8fafc" font-weight="bold">+99.4% REAL-TIME</text>
    </g>

    <!-- Dynamic Decorative Metric Card 2 (Lower Right) -->
    <g class="chip-card-2" transform="translate(860, 290)">
      <rect width="210" height="50" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" />
      <circle cx="26" cy="25" r="10" fill="#38bdf8" fill-opacity="0.2" />
      <text x="26" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">⚡</text>
      <text x="46" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" font-weight="500">OPEN-SOURCE ERP</text>
      <text x="46" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#38bdf8" font-weight="bold">ZERO VENDOR LOCK-IN</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT LAYER (Completely clear, unblocked, high-contrast) -->
  <g id="foreground-content" transform="translate(70, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="320" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="16" cy="15" r="5" fill="#10b981" />
      <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1.2">CURATED ENTERPRISE DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#cyanBlueGrad)" letter-spacing="-0.5">
      AWESOME FINANCIAL MANAGEMENT
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17.5" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Curated Stack of Enterprise SaaS, Open-Source ERPs, FP&amp;A, Treasury &amp; AP Automation
    </text>

    <!-- Key Functional Domains / Pill Row -->
    <g transform="translate(0, 212)">
      <!-- Pill 1: Enterprise SaaS -->
      <g transform="translate(0, 0)">
        <rect width="168" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#f8fafc">🏢 Enterprise SaaS</text>
      </g>
      <!-- Pill 2: Open Source ERPs -->
      <g transform="translate(180, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#38bdf8">🔓 Open Source ERPs</text>
      </g>
      <!-- Pill 3: FP&A & Treasury -->
      <g transform="translate(372, 0)">
        <rect width="162" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#a855f7">📊 FP&amp;A &amp; Treasury</text>
      </g>
      <!-- Pill 4: AP Automation -->
      <g transform="translate(546, 0)">
        <rect width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#10b981">⚡ AP Automation</text>
      </g>
    </g>

    <!-- Bottom Secondary Info / Metadata Tagline -->
    <g transform="translate(0, 282)">
      <line x1="0" y1="0" x2="680" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
      <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
        💡 For CFOs, Controllers, Finance Engineers &amp; Operations Teams • Verified Pricing &amp; Star Metrics
      </text>
    </g>
  </g>

  <!-- Border Accent Outline -->
  <rect width="1280" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8" />
</svg>